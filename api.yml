openapi: 3.1.0
info:
  title: The YNAFB api description
  description: |
    This API allows for managing the state of budgets, accounts and their 
    components. It is used by the YNAFB frontend.
  version: 0.0.1
paths:
  /budget:
    get:
      summary: Get the list of the user's budgets
      responses:
        "200":
          description: everything is fine
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/budget"
    post:
      summary: Create a new budget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: the budget name
                  type: string
      responses:
        "201":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budget"

  /budget/{budgetId}:
    get:
      summary: get a budget's month summary for the current month
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The budgets monthly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budgetMonth"
    
    put:
      summary: Update a budget
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: the new budget name
                  type: string
      responses:
        "200":
          description: Successfully updated 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budget"

    delete:
      summary: Delete a budget
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted

  /budget/{budgetId}/{month}:
    get:
      summary: get a budget's month summary for the current month
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: month
        in: path
        description: the monthly budget to pull
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budgetMonth"

  /budget/{budgetId}/account:
    get:
      summary: Get the lisst of accounts in a budget with balance information
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/accountSummaryDetail"

    post:
      summary: Create a new account in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new account
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/account"

  /budget/{budgetId}/account/{id}:
    get:
      summary: Get an account's balance summary and its transactions
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The account summary and its transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accountDetail"

    put:
      summary: Update an account
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new account name
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/account"

    delete:
      summary: Delete an account
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/account/{id}/import:
    post:
      summary: Import transactions into an account from a bank statement file
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - statement
              properties:
                statement:
                  type: string
                  format: binary
                  description: The bank statement file to import
      responses:
        "200":
          description: The number of transactions imported
          content:
            text/plain:
              schema:
                type: integer

  /budget/{budgetId}/account/{id}/reconcile:
    post:
      summary: Reconcile an account against a statement balance
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - balance
              properties:
                date:
                  type: string
                  description: Reconcile all transactions up to and including this date (RFC3339)
                balance:
                  type: integer
                  description: The statement balance as of the date (in cents)
      responses:
        "200":
          description: Successfully reconciled

  /budget/{budgetId}/account/{accountId}/transaction:
    post:
      summary: Create a new transaction in an account
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - payeeId
                - date
                - outflow
                - inflow
              properties:
                payeeId:
                  type: integer
                  description: The payee the transaction is with
                date:
                  type: string
                  description: The transaction date (RFC3339)
                outflow:
                  type: integer
                  description: The total outflow of the transaction
                inflow:
                  type: integer
                  description: The total inflow of the transaction
                note:
                  type: string
                  description: A note on the transaction
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/transaction"

  /budget/{budgetId}/account/{accountId}/transaction/{id}:
    put:
      summary: Update a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - payeeId
                - date
                - outflow
                - inflow
              properties:
                payeeId:
                  type: integer
                  description: The payee the transaction is with
                date:
                  type: string
                  description: The transaction date (RFC3339)
                outflow:
                  type: integer
                  description: The total outflow of the transaction
                inflow:
                  type: integer
                  description: The total inflow of the transaction
                note:
                  type: string
                  description: A note on the transaction
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/transaction"
    delete:
      summary: Delete a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/account/{accountId}/transaction/{trxId}/line:
    post:
      summary: Create a new line on a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - outflow
                - inflow
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                expenseShareId:
                  type: integer
                  description: The expense share id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                outflow:
                  type: integer
                  description: The outflow of this line
                inflow:
                  type: integer
                  description: The inflow of this line
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trxLine"

  /budget/{budgetId}/account/{accountId}/transaction/{trxId}/line/{id}:
    put:
      summary: Update a line on a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the line id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - outflow
                - inflow
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                expenseShareId:
                  type: integer
                  description: The expense share id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                outflow:
                  type: integer
                  description: The outflow of this line
                inflow:
                  type: integer
                  description: The inflow of this line
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trxLine"
    delete:
      summary: Delete a line on a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the line id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/category:
    get:
      summary: Get the list of categories in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/category"
    post:
      summary: Create a new category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new category
                categoryGroupId:
                  type: integer
                  description: The id of the category group this category belongs to (if any)
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/category"

  /budget/{budgetId}/category/{id}:
    put:
      summary: Update a category
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new category name
                categoryGroupId:
                  type: integer
                  description: The id of the category group this category belongs to (if any)
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/category"
    delete:
      summary: Delete a category
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/category/{id}/allocation/{month}:
    put:
      summary: Set the allocation amount for a category in a given month
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category id
        required: true
        schema:
          type: string
      - name: month
        in: path
        description: the month to allocate for (YYYY-MM)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  description: The amount to allocate to this category for the month
      responses:
        "200":
          description: Successfully allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/allocation"

  /budget/{budgetId}/category/{categoryId}/goal:
    get:
      summary: Get the goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The goal for the category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/goal"
    post:
      summary: Create a new goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - startMonth
                - amount
              properties:
                type:
                  type: string
                  enum: [monthly, save, refill]
                  description: The type of goal
                startMonth:
                  type: string
                  description: The month the goal starts (YYYY-MM)
                endMonth:
                  type: string
                  description: The month the goal ends (exclusive, required for save goals)
                amount:
                  type: integer
                  description: The goals amount value (meaning varies by type)
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/goal"
    put:
      summary: Update the goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - startMonth
                - amount
              properties:
                type:
                  type: string
                  enum: [monthly, save, refill]
                  description: The type of goal
                startMonth:
                  type: string
                  description: The month the goal starts (YYYY-MM)
                endMonth:
                  type: string
                  description: The month the goal ends (exclusive, required for save goals)
                amount:
                  type: integer
                  description: The goals amount value (meaning varies by type)
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/goal"
    delete:
      summary: Delete the goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/category-group:
    get:
      summary: Get the list of category groups in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of category groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/categoryGroup"
    post:
      summary: Create a new category group in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new category group
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categoryGroup"

  /budget/{budgetId}/category-group/{id}:
    put:
      summary: Update a category group
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category group id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new category group name
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categoryGroup"
    delete:
      summary: Delete a category group
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category group id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/payee:
    get:
      summary: Get the list of payees in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of payees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/payee"
    post:
      summary: Create a new payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new payee
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payee"

  /budget/{budgetId}/payee/{id}:
    put:
      summary: Update a payee
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new payee name
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payee"
    delete:
      summary: Delete a payee
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/payee/{payeeId}/default-line:
    get:
      summary: Get the list of default lines for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of default lines for the payee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/payeeDefaultLine"
    post:
      summary: Create a new default line for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - percent
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                expenseShareId:
                  type: integer
                  description: The expense share id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                percent:
                  type: integer
                  description: The percent of the transaction this line accounts for
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payeeDefaultLine"

  /budget/{budgetId}/payee/{payeeId}/default-line/{id}:
    put:
      summary: Update a default line for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the default line id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - percent
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                expenseShareId:
                  type: integer
                  description: The expense share id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                percent:
                  type: integer
                  description: The percent of the transaction this line accounts for
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payeeDefaultLine"
    delete:
      summary: Delete a default line for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the default line id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/expense-share:
    get:
      summary: List the expense shares this budget is linked to
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BudgetExpenseShare"
    post:
      summary: |
        Create a new empty expense share and link it to this budget
        If an expesne share code is passed in, it will join an existing expense share
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                defaultName:
                  type: string
                  description: The defualt name, only applicable when creating an expense share
                code:
                  type: string
                  description: The code of an existing expense share to join
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExpenseShare"

  /budget/{budgetId}/expense-share/{expenseShareId}/code:
    get: 
      summary: Get a new expense share code to share with others
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: expenseShareId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: object
                required:
                  - code
                properties:
                  code:
                    type: string

  /budget/{budgetId}/expense-share/{expenseShareId}:
    # get: 
    #   summary: |
    #     Get the expense share summary for this budget
    #     Similar to the account summary, showing the details and all the transactions
    put: 
      summary: Update an expense share for this budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: expenseShareId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: The name for the expense share in this budget
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BudgetExpenseShare"
    delete:
      summary: Delete an expense share from this budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: expenseShareId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted

  # /budget/{budgetId}/expense-share/{expenseShareId}/trx:
  #   post:
  #     summary: Publish a transaction to the expense share for others to see 
  #   put:
  #     summary: Update transaction in the expense share for all users
  #   delete:
  #     summary: Delete transaction in the expense share for all users
  #
  # /budget/{budgetId}/expense-share/{expenseShareId}/trx/{trxId}/split:
