openapi: 3.1.0
info:
  title: The YNAFB api description
  description: |
    This API allows for managing the state of budgets, accounts and their 
    components. It is used by the YNAFB frontend.
  version: 0.0.1
paths:
  /budget:
    get:
      summary: Get the list of the user's budgets
      responses:
        "200":
          description: everything is fine
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/budget"
    post:
      summary: Create a new budget
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: the budget name
                  type: string
      responses:
        "201":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budget"

  /budget/{budgetId}:
    get:
      summary: get a budget's month summary for the current month
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The budgets monthly summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budgetMonth"
    
    put:
      summary: Update a budget
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  description: the new budget name
                  type: string
      responses:
        "200":
          description: Successfully updated 
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budget"

    delete:
      summary: Delete a budget
      parameters:
      - name: budgetId
        in: path
        required: true
        schema:
          type: string
      responses:
        "204":
          description: Successfully deleted

  /budget/{budgetId}/{month}:
    get:
      summary: get a budget's month summary for the current month
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: month
        in: path
        description: the monthly budget to pull
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/budgetMonth"

  /budget/{budgetId}/account:
    get:
      summary: Get the lisst of accounts in a budget with balance information
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/accountSummaryDetail"

    post:
      summary: Create a new account in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new account
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/account"

  /budget/{budgetId}/account/{id}:
    get:
      summary: Get an account's balance summary and its transactions
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The account summary and its transactions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/accountDetail"

    put:
      summary: Update an account
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new account name
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/account"

    delete:
      summary: Delete an account
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/account/{id}/import:
    post:
      summary: Import transactions into an account from a bank statement file
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - statement
              properties:
                statement:
                  type: string
                  format: binary
                  description: The bank statement file to import
      responses:
        "200":
          description: The number of transactions imported
          content:
            text/plain:
              schema:
                type: integer

  /budget/{budgetId}/account/{id}/reconcile:
    post:
      summary: Reconcile an account against a statement balance
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - date
                - balance
              properties:
                date:
                  type: string
                  description: Reconcile all transactions up to and including this date (RFC3339)
                balance:
                  type: integer
                  description: The statement balance as of the date (in cents)
      responses:
        "200":
          description: Successfully reconciled

  /budget/{budgetId}/account/{accountId}/transaction:
    post:
      summary: Create a new transaction in an account
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - payeeId
                - date
                - outflow
                - inflow
              properties:
                payeeId:
                  type: integer
                  description: The payee the transaction is with
                date:
                  type: string
                  description: The transaction date (RFC3339)
                outflow:
                  type: integer
                  description: The total outflow of the transaction
                inflow:
                  type: integer
                  description: The total inflow of the transaction
                note:
                  type: string
                  description: A note on the transaction
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/transaction"

  /budget/{budgetId}/account/{accountId}/transaction/{id}:
    put:
      summary: Update a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - payeeId
                - date
                - outflow
                - inflow
              properties:
                payeeId:
                  type: integer
                  description: The payee the transaction is with
                date:
                  type: string
                  description: The transaction date (RFC3339)
                outflow:
                  type: integer
                  description: The total outflow of the transaction
                inflow:
                  type: integer
                  description: The total inflow of the transaction
                note:
                  type: string
                  description: A note on the transaction
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/transaction"
    delete:
      summary: Delete a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/account/{accountId}/transaction/{trxId}/line:
    post:
      summary: Create a new line on a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - outflow
                - inflow
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                expenseShareId:
                  type: integer
                  description: The expense share id (required on split and settlement lines, absent otherwise)
                splitBudgetId:
                  type: integer
                  description: The tagged member budget id (for split lines, mutually exclusive with destBudgetId)
                destBudgetId:
                  type: integer
                  description: The counterparty member budget id (for settlement lines, mutually exclusive with splitBudgetId)
                outflow:
                  type: integer
                  description: The outflow of this line
                inflow:
                  type: integer
                  description: The inflow of this line
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trxLine"

  /budget/{budgetId}/account/{accountId}/transaction/{trxId}/line/{id}:
    put:
      summary: Update a line on a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the line id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - outflow
                - inflow
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                expenseShareId:
                  type: integer
                  description: The expense share id (required on split and settlement lines, absent otherwise)
                splitBudgetId:
                  type: integer
                  description: The tagged member budget id (for split lines, mutually exclusive with destBudgetId)
                destBudgetId:
                  type: integer
                  description: The counterparty member budget id (for settlement lines, mutually exclusive with splitBudgetId)
                outflow:
                  type: integer
                  description: The outflow of this line
                inflow:
                  type: integer
                  description: The inflow of this line
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/trxLine"
    delete:
      summary: Delete a line on a transaction
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: accountId
        in: path
        description: the account id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the transaction id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the line id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/category:
    get:
      summary: Get the list of categories in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of categories
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/category"
    post:
      summary: Create a new category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new category
                categoryGroupId:
                  type: integer
                  description: The id of the category group this category belongs to (if any)
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/category"

  /budget/{budgetId}/category/{id}:
    put:
      summary: Update a category
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new category name
                categoryGroupId:
                  type: integer
                  description: The id of the category group this category belongs to (if any)
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/category"
    delete:
      summary: Delete a category
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/category/{id}/allocation/{month}:
    put:
      summary: Set the allocation amount for a category in a given month
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category id
        required: true
        schema:
          type: string
      - name: month
        in: path
        description: the month to allocate for (YYYY-MM)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - amount
              properties:
                amount:
                  type: integer
                  description: The amount to allocate to this category for the month
      responses:
        "200":
          description: Successfully allocated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/allocation"

  /budget/{budgetId}/category/{categoryId}/goal:
    get:
      summary: Get the goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The goal for the category
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/goal"
    post:
      summary: Create a new goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - startMonth
                - amount
              properties:
                type:
                  type: string
                  enum: [monthly, save, refill]
                  description: The type of goal
                startMonth:
                  type: string
                  description: The month the goal starts (YYYY-MM)
                endMonth:
                  type: string
                  description: The month the goal ends (exclusive, required for save goals)
                amount:
                  type: integer
                  description: The goals amount value (meaning varies by type)
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/goal"
    put:
      summary: Update the goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - type
                - startMonth
                - amount
              properties:
                type:
                  type: string
                  enum: [monthly, save, refill]
                  description: The type of goal
                startMonth:
                  type: string
                  description: The month the goal starts (YYYY-MM)
                endMonth:
                  type: string
                  description: The month the goal ends (exclusive, required for save goals)
                amount:
                  type: integer
                  description: The goals amount value (meaning varies by type)
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/goal"
    delete:
      summary: Delete the goal for a category in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: categoryId
        in: path
        description: the category id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/category-group:
    get:
      summary: Get the list of category groups in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of category groups
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/categoryGroup"
    post:
      summary: Create a new category group in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new category group
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categoryGroup"

  /budget/{budgetId}/category-group/{id}:
    put:
      summary: Update a category group
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category group id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new category group name
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/categoryGroup"
    delete:
      summary: Delete a category group
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the category group id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/payee:
    get:
      summary: Get the list of payees in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of payees
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/payee"
    post:
      summary: Create a new payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The name of the new payee
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payee"

  /budget/{budgetId}/payee/{id}:
    put:
      summary: Update a payee
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                  description: The new payee name
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payee"
    delete:
      summary: Delete a payee
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/payee/{payeeId}/default-line:
    get:
      summary: Get the list of default lines for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of default lines for the payee
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/payeeDefaultLine"
    post:
      summary: Create a new default line for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - percent
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                expenseShareId:
                  type: integer
                  description: The expense share id (required on split and settlement lines, absent otherwise)
                splitBudgetId:
                  type: integer
                  description: The tagged member budget id (for split lines, mutually exclusive with destBudgetId)
                destBudgetId:
                  type: integer
                  description: The counterparty member budget id (for settlement lines, mutually exclusive with splitBudgetId)
                percent:
                  type: integer
                  description: The percent of the transaction this line accounts for
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payeeDefaultLine"

  /budget/{budgetId}/payee/{payeeId}/default-line/{id}:
    put:
      summary: Update a default line for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the default line id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - percent
              properties:
                destAccountId:
                  type: integer
                  description: The destination account id (for transfer lines)
                categoryId:
                  type: integer
                  description: The category id (for spend lines)
                income:
                  type: boolean
                  description: Whether this is an income line
                expenseShareId:
                  type: integer
                  description: The expense share id (required on split and settlement lines, absent otherwise)
                splitBudgetId:
                  type: integer
                  description: The tagged member budget id (for split lines, mutually exclusive with destBudgetId)
                destBudgetId:
                  type: integer
                  description: The counterparty member budget id (for settlement lines, mutually exclusive with splitBudgetId)
                percent:
                  type: integer
                  description: The percent of the transaction this line accounts for
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/payeeDefaultLine"
    delete:
      summary: Delete a default line for a payee in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: payeeId
        in: path
        description: the payee id
        required: true
        schema:
          type: string
      - name: id
        in: path
        description: the default line id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

  /budget/{budgetId}/expense-share:
    get:
      summary: Get the list of expense share memberships in a budget
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The list of expense share memberships
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/expenseShareMembership"
    post:
      summary: Create a new expense share with this budget as the first member
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
                - displayName
              properties:
                defaultName:
                  type: string
                  description: The global default name (immutable, defaults to name)
                name:
                  type: string
                  description: How this expense share is displayed for this budget
                displayName:
                  type: string
                  description: How this budget is displayed to other members
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/expenseShareMembership"

  /budget/{budgetId}/expense-share/join:
    post:
      summary: Join an expense share via an invite code
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - code
                - name
                - displayName
              properties:
                code:
                  type: string
                  description: The invite code minted by an existing member
                name:
                  type: string
                  description: How this expense share is displayed for this budget
                displayName:
                  type: string
                  description: How this budget is displayed to other members
      responses:
        "200":
          description: Successfully joined
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/expenseShareMembership"

  /budget/{budgetId}/expense-share/{shareId}:
    get:
      summary: Get an expense share with members, transactions and summary
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: The expense share detail
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/expenseShareDetail"
    put:
      summary: Rename an expense share membership (local name and display name)
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: How this expense share is displayed for this budget
                displayName:
                  type: string
                  description: How this budget is displayed to other members
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/expenseShareMembership"
    delete:
      summary: Leave an expense share (auto-deletes the share when the last member leaves)
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully left

  /budget/{budgetId}/expense-share/{shareId}/code:
    post:
      summary: Mint a new invite code for an expense share (server-generated, server-decided expiry)
      parameters:
      - name: budgetId
        in: path
        description: the budget id
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully minted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/expenseShareCode"

  /budget/{budgetId}/expense-share/{shareId}/transaction/{trxId}/line:
    post:
      summary: Categorize my portion of a shared transaction (counterparty of the source trx)
      parameters:
      - name: budgetId
        in: path
        description: the categorizing budget id (must be a member of the share)
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the source transaction id (in another member budget, source budget resolved backend-side)
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - outflow
                - inflow
              properties:
                categoryId:
                  type: integer
                  description: The category id (spend only)
                outflow:
                  type: integer
                  description: The outflow of this categorization
                inflow:
                  type: integer
                  description: The inflow of this categorization
      responses:
        "200":
          description: Successfully created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/splitCategorization"
    get:
      summary: List my categorizations of a shared transaction
      parameters:
      - name: budgetId
        in: path
        description: the categorizing budget id
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the source transaction id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: My categorizations for the source transaction
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/splitCategorization"

  /budget/{budgetId}/expense-share/{shareId}/transaction/{trxId}/line/{lineId}:
    put:
      summary: Update my categorization of a shared transaction
      parameters:
      - name: budgetId
        in: path
        description: the categorizing budget id
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the source transaction id
        required: true
        schema:
          type: string
      - name: lineId
        in: path
        description: the categorization id
        required: true
        schema:
          type: string
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - categoryId
                - outflow
                - inflow
              properties:
                categoryId:
                  type: integer
                  description: The category id (spend only)
                outflow:
                  type: integer
                  description: The outflow of this categorization
                inflow:
                  type: integer
                  description: The inflow of this categorization
      responses:
        "200":
          description: Successfully updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/splitCategorization"
    delete:
      summary: Delete my categorization of a shared transaction
      parameters:
      - name: budgetId
        in: path
        description: the categorizing budget id
        required: true
        schema:
          type: string
      - name: shareId
        in: path
        description: the expense share id
        required: true
        schema:
          type: string
      - name: trxId
        in: path
        description: the source transaction id
        required: true
        schema:
          type: string
      - name: lineId
        in: path
        description: the categorization id
        required: true
        schema:
          type: string
      responses:
        "200":
          description: Successfully deleted

components:
  schemas:
    budget:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The budget id"
        name:
          type: string
          description: "The budget name"

    budgetMonth:
      type: object
      required:
        - month
        - summary
        - categories
      properties:
        month:
          type: string
          description: "The month the budget is for (first day)"
        summary:
          $ref: "#/components/schemas/budgetMonthSummary"
        categories:
          type: array
          description: The list of all the categories and their values for the month
          items:
            $ref: "#/components/schemas/budgetMonthCategory"

    budgetMonthCategory:
      type: object
      required:
        - categoryId
        - categoryName
        - allocated
        - spent
        - available
      properties:
        categoryId:
          type: integer
        categoryName:
          type: string
        categoryGroupName:
          type: string
        allocated:
          type: integer
          description: The amount of money allocated to this category this month
        spent:
          type: integer
          description: The amount of money spent in this category this month
        available:
          type: integer
          description: The amount of money available to spen in this category (to date allocations - spend)
        goal:
          $ref: "#/components/schemas/budgetMonthGoal"

    budgetMonthSummary:
      type: object
      required:
        - readyToAssign
        - income
        - allocated
        - spent
        - uncategorized
      properties:
        readyToAssign:
          type: integer
          description: The amount of money that is available to assign (net worth - already assigned to date)
        income:
          type: integer
          description: The total income for the month
        allocated:
          type: integer
          description: The total allocated for the month
        spent:
          type: integer
          description: The total spent for the month
        uncategorized:
          type: integer
          description: The absolute value of the uncategorize transactions

    budgetMonthGoal:
      type: object
      required:
        - type
        - startMonth
        - amount
        - allocated
        - amountForMonth
        - gap
      properties:
        type:
          type: string
          enum: [monthly, save, refill]
          description: The type of goal this is
        startMonth:
          type: string
          description: The month the goal started
        endMonth:
          type: string
          description: The month the goal ends (exclusive)
        amount:
          type: integer
          description: The goals amount value (meaning varies by type)
        allocated:
          type: integer
          description: The total amount allocated to this goal to date (previous months only)
        amountForMonth:
          type: integer
          description: The amount needed to allocated this month to stay on track
        gap:
          type: integer
          description: The difference between the allocated amount and the amountForMonth

    account:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The account id"
        name:
          type: string
          description: "The account name"

    accountDetail:
      type: object
      required:
        - summary
        - transactions
      properties:
        summary:
          $ref: "#/components/schemas/accountSummaryDetail"
        transactions:
          type: array
          description: The account's transactions, each with its nested transaction lines
          items:
            $ref: "#/components/schemas/accountTransaction"

    accountSummaryDetail:
      type: object
      required:
        - id
        - name
        - balance
        - reconciledBalance
      properties:
        id:
          type: integer
        name:
          type: string
        balance:
          type: integer
        reconciledBalance:
          type: integer

    accountTransaction:
      type: object
      required:
        - id
        - date
        - payeeId
        - payeeName
        - outflow
        - inflow
        - note
        - reconciled
        - transactionLines
      properties:
        id:
          type: integer
        sourceAccountId:
          type: integer
          description: "The account the funds were transferred from (present only on mirror transfer rows)"
        sourceAccountName:
          type: string
          description: "The name of the account the funds were transferred from (present only on mirror transfer rows)"
        date:
          type: string
        payeeId:
          type: integer
        payeeName:
          type: string
        outflow:
          type: integer
          description: "The total outflow of the transaction"
        inflow:
          type: integer
          description: "The total inflow of the transaction"
        note:
          type: string
        reconciled:
          type: boolean
        transactionLines:
          type: array
          description: The transaction's lines (category allocations and transfers)
          items:
            $ref: "#/components/schemas/accountTransactionLine"

    accountTransactionLine:
      type: object
      description: |
        a transaction line, can be one of a transfer to a destination account,
        income, a categorization, a split tagging another member budget,
        or a settlement with another member budget.
      required:
        - lineId
        - income
        - outflow
        - inflow
      properties:
        lineId:
          type: integer
        destAccountId:
          type: integer
        destAccountName:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        expenseShareId:
          type: integer
          description: "The expense share id (present on split and settlement lines)"
        splitBudgetId:
          type: integer
          description: "The tagged member budget id (present on split lines)"
        splitBudgetDisplayName:
          type: string
          description: "How the tagged member is displayed (present on split lines in responses)"
        destBudgetId:
          type: integer
          description: "The counterparty member budget id (present on settlement lines)"
        destBudgetDisplayName:
          type: string
          description: "How the settlement counterparty is displayed (present on settlement lines in responses)"
        income:
          type: boolean
        outflow:
          type: integer
        inflow:
          type: integer

    category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The category id"
        name:
          type: string
          description: "The category name"
        categoryGroupId:
          type: integer
          description: "The id of the category group this category belongs to (if any)"

    categoryGroup:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The category group id"
        name:
          type: string
          description: "The category group name"

    allocation:
      type: object
      required:
        - id
        - categoryId
        - month
        - amount
      properties:
        id:
          type: integer
          description: "The allocation id"
        categoryId:
          type: integer
          description: "The category the allocation is for"
        month:
          type: string
          description: "The month the allocation is for (first day)"
        amount:
          type: integer
          description: "The amount allocated to the category for the month"

    goal:
      type: object
      required:
        - id
        - categoryId
        - type
        - startMonth
        - amount
      properties:
        id:
          type: integer
          description: "The goal id"
        categoryId:
          type: integer
          description: "The category the goal is for"
        type:
          type: string
          enum: [monthly, save, refill]
          description: "The type of goal"
        startMonth:
          type: string
          description: "The month the goal started (first day)"
        endMonth:
          type: string
          description: "The month the goal ends (exclusive)"
        amount:
          type: integer
          description: "The goals amount value (meaning varies by type)"

    payee:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The payee id"
        name:
          type: string
          description: "The payee name"

    payeeDefaultLine:
      type: object
      required:
        - id
        - payeeId
        - income
        - percent
      properties:
        id:
          type: integer
          description: "The default line id"
        payeeId:
          type: integer
          description: "The payee the default line is for"
        destAccountId:
          type: integer
          description: "The destination account id (present on transfer lines)"
        destAccountName:
          type: string
          description: "The destination account name (present on list responses)"
        categoryId:
          type: integer
          description: "The category id (present on spend lines)"
        categoryName:
          type: string
          description: "The category name (present on list responses)"
        income:
          type: boolean
          description: "Whether this is an income line"
        expenseShareId:
          type: integer
          description: "The expense share id (present on split and settlement lines)"
        splitBudgetId:
          type: integer
          description: "The tagged member budget id (present on split lines)"
        splitBudgetDisplayName:
          type: string
          description: "How the tagged member is displayed (present on split lines in responses)"
        destBudgetId:
          type: integer
          description: "The counterparty member budget id (present on settlement lines)"
        destBudgetDisplayName:
          type: string
          description: "How the settlement counterparty is displayed (present on settlement lines in responses)"
        percent:
          type: integer
          description: "The percent of the transaction this line accounts for"

    transaction:
      type: object
      required:
        - id
        - accountId
        - payeeId
        - date
        - outflow
        - inflow
        - note
      properties:
        id:
          type: integer
          description: "The transaction id"
        accountId:
          type: integer
          description: "The account the transaction is in"
        payeeId:
          type: integer
          description: "The payee the transaction is with"
        date:
          type: string
          description: "The transaction date (RFC3339)"
        outflow:
          type: integer
          description: "The total outflow of the transaction"
        inflow:
          type: integer
          description: "The total inflow of the transaction"
        note:
          type: string
          description: "A note on the transaction"

    trxLine:
      type: object
      required:
        - id
        - trxId
        - income
        - outflow
        - inflow
      properties:
        id:
          type: integer
          description: "The line id"
        trxId:
          type: integer
          description: "The transaction the line is on"
        destAccountId:
          type: integer
          description: "The destination account id (present on transfer lines)"
        categoryId:
          type: integer
          description: "The category id (present on spend lines)"
        income:
          type: boolean
          description: "Whether this is an income line"
        expenseShareId:
          type: integer
          description: "The expense share id (present on split and settlement lines)"
        splitBudgetId:
          type: integer
          description: "The tagged member budget id (present on split lines)"
        splitBudgetDisplayName:
          type: string
          description: "How the tagged member is displayed (present on split lines in responses)"
        destBudgetId:
          type: integer
          description: "The counterparty member budget id (present on settlement lines)"
        destBudgetDisplayName:
          type: string
          description: "How the settlement counterparty is displayed (present on settlement lines in responses)"
        outflow:
          type: integer
          description: "The outflow of this line"
        inflow:
          type: integer
          description: "The inflow of this line"

    expenseShareMembership:
      type: object
      required:
        - id
        - expenseShareId
        - budgetId
        - name
        - displayName
      properties:
        id:
          type: integer
          description: "The membership id"
        expenseShareId:
          type: integer
          description: "The global expense share id"
        budgetId:
          type: integer
          description: "The member budget id"
        name:
          type: string
          description: "How this expense share is displayed for this budget"
        displayName:
          type: string
          description: "How this budget is displayed to other members"

    expenseShareDetail:
      type: object
      required:
        - membership
        - summary
        - members
        - transactions
      properties:
        membership:
          $ref: "#/components/schemas/expenseShareMembership"
        summary:
          $ref: "#/components/schemas/expenseShareSummary"
        members:
          type: array
          description: "All budgets in the expense share"
          items:
            $ref: "#/components/schemas/shareMember"
        transactions:
          type: array
          description: "Live source transactions carrying split or settlement lines in this share (totals/payee/date/note resolved live, only the caller's own categorizations included)"
          items:
            $ref: "#/components/schemas/expenseShareTransaction"

    expenseShareSummary:
      type: object
      required:
        - balance
        - memberBalances
      properties:
        balance:
          type: integer
          description: "Caller net (splits I tagged others minus splits others tagged me minus settlements I sent plus settlements I received, outflow minus inflow; positive means others owe me; categorizations are balance-neutral)"
        memberBalances:
          type: array
          description: "Pairwise nets with each other active member (self excluded, zero-activity omitted)"
          items:
            $ref: "#/components/schemas/expenseShareMemberBalance"

    expenseShareMemberBalance:
      type: object
      required:
        - budgetId
        - displayName
        - balance
      properties:
        budgetId:
          type: integer
          description: "The other member budget id"
        displayName:
          type: string
          description: "How this member is displayed to other members"
        balance:
          type: integer
          description: "Net with this member (splits I tagged them minus splits they tagged me minus settlements I sent them plus settlements I received from them, outflow minus inflow; positive means they owe me)"

    shareMember:
      type: object
      required:
        - budgetId
        - displayName
      properties:
        budgetId:
          type: integer
          description: "The member budget id"
        displayName:
          type: string
          description: "How this member is displayed to other members"

    expenseShareCode:
      type: object
      required:
        - code
        - expires
      properties:
        code:
          type: string
          description: "The invite code (server-generated, shown once)"
        expires:
          type: string
          description: "When the code expires (RFC3339, server-decided)"

    expenseShareTransaction:
      type: object
      required:
        - sourceBudgetId
        - sourceBudgetDisplayName
        - trxId
        - payeeName
        - date
        - totalOutflow
        - totalInflow
        - note
      properties:
        sourceBudgetId:
          type: integer
          description: "The member budget holding the source transaction"
        sourceBudgetDisplayName:
          type: string
          description: "How the source member is displayed"
        trxId:
          type: integer
          description: "The source transaction id (live reference, cascades on delete)"
        payeeName:
          type: string
          description: "Live source payee name"
        date:
          type: string
          description: "Live source date (RFC3339)"
        totalOutflow:
          type: integer
          description: "Live source total outflow"
        totalInflow:
          type: integer
          description: "Live source total inflow"
        note:
          type: string
          description: "Live source note"
        splitLines:
          type: array
          description: "Split lines on the source transaction tagging member budgets"
          items:
            $ref: "#/components/schemas/expenseShareSplitLine"
        settlementLine:
          $ref: "#/components/schemas/expenseShareSettlementLine"
          description: "Present only on single-line settlement transactions; the settlement amount always equals the parent totals"
        myCategorizations:
          type: array
          description: "Only the caller's own split categorizations of this source transaction"
          items:
            $ref: "#/components/schemas/splitCategorization"

    expenseShareSplitLine:
      type: object
      required:
        - splitBudgetId
        - splitBudgetDisplayName
        - outflow
        - inflow
      properties:
        splitBudgetId:
          type: integer
          description: "The counterparty member budget id"
        splitBudgetDisplayName:
          type: string
          description: "How the tagged member is displayed"
        outflow:
          type: integer
          description: "The outflow portion tagged"
        inflow:
          type: integer
          description: "The inflow portion tagged"

    expenseShareSettlementLine:
      type: object
      description: "A settlement counterparty; the parent single-line transaction totals are the settlement amount"
      required:
        - destBudgetId
        - destBudgetDisplayName
      properties:
        destBudgetId:
          type: integer
          description: "The counterparty member budget id"
        destBudgetDisplayName:
          type: string
          description: "How the counterparty is displayed"

    splitCategorization:
      type: object
      required:
        - id
        - outflow
        - inflow
      properties:
        id:
          type: integer
          description: "The categorization id"
        categoryId:
          type: integer
          description: "The category id (spend only)"
        categoryName:
          type: string
          description: "The category name (present on responses)"
        outflow:
          type: integer
          description: "The outflow of this categorization"
        inflow:
          type: integer
          description: "The inflow of this categorization"
