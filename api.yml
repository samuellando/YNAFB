  # /budget/{budgetId}/expense-share/{expenseShareId}/trx/{trxId}/split/{splitId}/line:
  #   post:
  #
  # /budget/{budgetId}/expense-share/{expenseShareId}/trx/{trxId}/split/{splitId}/line/{lineId}:
  #   post:
  #   put:
  #   delete:

components:
  schemas:
    budget:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The budget id"
        name:
          type: string
          description: "The budget name"

    budgetMonth:
      type: object
      required:
        - month
        - summary
        - categories
        - goals
      properties:
        month:
          type: string
          description: "The month the budget is for (first day)"
        summary:
          $ref: "#/components/schemas/budgetMonthSummary"
        categories:
          type: array
          description: The list of all the categories and their values for the month
          items:
            $ref: "#/components/schemas/budgetMonthCategory"

    budgetMonthCategory:
      type: object
      required:
        - categoryId
        - categoryName
        - allocated
        - spent
        - available
      properties:
        categoryId:
          type: integer
        categoryName:
          type: string
        categoryGroupName:
          type: string
        allocated:
          type: integer
          description: The amount of money allocated to this category this month
        spent:
          type: integer
          description: The amount of money spent in this category this month
        available:
          type: integer
          description: The amount of money available to spen in this category (to date allocations - spend)
        goal:
          $ref: "#/components/schemas/budgetMonthGoal"

    budgetMonthSummary:
      type: object
      required:
        - readyToAssign
        - income
        - allocated
        - spent
        - available
        - uncategorized
      properties:
        readyToAssign:
          type: integer
          description: The amount of money that is available to assign (net worth - already assigned to date)
        income:
          type: integer
          description: The total income for the month
        allocated:
          type: integer
          description: The total allocated for the month
        spent:
          type: integer
          description: The total spent for the month
        available:
          type: integer
          description: The total available to spent (total allocated to date - spend)
        uncategorized:
          type: integer
          description: The absolute value of the uncategorize transactions

    budgetMonthGoal:
      type: object
      required:
        - type
        - startMonth
        - amount
        - allocated
        - amountForMonth
        - gap
      properties:
        type:
          type: string
          enum: [monthly, save, refill]
          description: The type of goal this is
        startMonth:
          type: string
          description: The month the goal started
        endMonth:
          type: string
          description: The month the goal ends (exclusive)
        amount:
          type: integer
          description: The goals amount value (meaning varies by type)
        allocated:
          type: integer
          description: The total amount allocated to this goal to date (previous months only)
        amountForMonth:
          type: integer
          description: The amount needed to allocated this month to stay on track
        gap:
          type: integer
          description: The difference between the allocated amount and the amountForMonth

    account:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The account id"
        name:
          type: string
          description: "The account name"

    accountDetail:
      type: object
      required:
        - summary
        - transactions
      properties:
        summary:
          $ref: "#/components/schemas/accountSummaryDetail"
        transactions:
          type: array
          description: The account's transactions, each with its nested transaction lines
          items:
            $ref: "#/components/schemas/accountTransaction"

    accountSummaryDetail:
      type: object
      required:
        - id
        - name
        - balance
        - reconciledBalance
      properties:
        id:
          type: integer
        name:
          type: string
        balance:
          type: integer
        reconciledBalance:
          type: integer

    accountTransaction:
      type: object
      required:
        - id
        - date
        - payeeId
        - payeeName
        - outflow
        - inflow
        - note
        - reconciled
        - transactionLines
      properties:
        id:
          type: integer
        sourceAccountId:
          type: integer
          description: "The account the funds were transferred from (present only on mirror transfer rows)"
        sourceAccountName:
          type: string
          description: "The name of the account the funds were transferred from (present only on mirror transfer rows)"
        date:
          type: string
        payeeId:
          type: integer
        payeeName:
          type: string
        outflow:
          type: integer
          description: "The total outflow of the transaction"
        inflow:
          type: integer
          description: "The total inflow of the transaction"
        note:
          type: string
        reconciled:
          type: boolean
        transactionLines:
          type: array
          description: The transaction's lines (category allocations and transfers)
          items:
            $ref: "#/components/schemas/accountTransactionLine"

    accountTransactionLine:
      type: object
      description: |
        a transaction line, can be one of a transfer to a destination account,
        income, or a categorization.
      required:
        - lineId
        - income
        - outflow
        - inflow
      properties:
        lineId:
          type: integer
        destAccountId:
          type: integer
        destAccountName:
          type: string
        categoryId:
          type: integer
        categoryName:
          type: string
        expenseShareId:
          type: integer
        expenseShareName:
          type: string 
        income:
          type: boolean
        outflow:
          type: integer
        inflow:
          type: integer

    category:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The category id"
        name:
          type: string
          description: "The category name"
        categoryGroupId:
          type: integer
          description: "The id of the category group this category belongs to (if any)"

    categoryGroup:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The category group id"
        name:
          type: string
          description: "The category group name"

    allocation:
      type: object
      required:
        - id
        - categoryId
        - month
        - amount
      properties:
        id:
          type: integer
          description: "The allocation id"
        categoryId:
          type: integer
          description: "The category the allocation is for"
        month:
          type: string
          description: "The month the allocation is for (first day)"
        amount:
          type: integer
          description: "The amount allocated to the category for the month"

    goal:
      type: object
      required:
        - id
        - categoryId
        - type
        - startMonth
        - amount
      properties:
        id:
          type: integer
          description: "The goal id"
        categoryId:
          type: integer
          description: "The category the goal is for"
        type:
          type: string
          enum: [monthly, save, refill]
          description: "The type of goal"
        startMonth:
          type: string
          description: "The month the goal started (first day)"
        endMonth:
          type: string
          description: "The month the goal ends (exclusive)"
        amount:
          type: integer
          description: "The goals amount value (meaning varies by type)"

    payee:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
          description: "The payee id"
        name:
          type: string
          description: "The payee name"

    payeeDefaultLine:
      type: object
      required:
        - id
        - payeeId
        - income
        - percent
      properties:
        id:
          type: integer
          description: "The default line id"
        payeeId:
          type: integer
          description: "The payee the default line is for"
        destAccountId:
          type: integer
          description: "The destination account id (present on transfer lines)"
        destAccountName:
          type: string
          description: "The destination account name (present on list responses)"
        categoryId:
          type: integer
          description: "The category id (present on spend lines)"
        categoryName:
          type: string
          description: "The category name (present on list responses)"
        expenseShareId:
          type: integer
          description: The expense share id (for spend lines)
        expenseShareName:
          type: string 
          description: The expense share name (for spend lines)
        income:
          type: boolean
          description: "Whether this is an income line"
        percent:
          type: integer
          description: "The percent of the transaction this line accounts for"

    transaction:
      type: object
      required:
        - id
        - accountId
        - payeeId
        - date
        - outflow
        - inflow
        - note
      properties:
        id:
          type: integer
          description: "The transaction id"
        accountId:
          type: integer
          description: "The account the transaction is in"
        payeeId:
          type: integer
          description: "The payee the transaction is with"
        date:
          type: string
          description: "The transaction date (RFC3339)"
        outflow:
          type: integer
          description: "The total outflow of the transaction"
        inflow:
          type: integer
          description: "The total inflow of the transaction"
        note:
          type: string
          description: "A note on the transaction"

    trxLine:
      type: object
      required:
        - id
        - trxId
        - income
        - outflow
        - inflow
      properties:
        id:
          type: integer
          description: "The line id"
        trxId:
          type: integer
          description: "The transaction the line is on"
        destAccountId:
          type: integer
          description: "The destination account id (present on transfer lines)"
        categoryId:
          type: integer
          description: "The category id (present on spend lines)"
        expenseShareId:
          type: integer
          description: The expense share id (for spend lines)
        income:
          type: boolean
          description: "Whether this is an income line"
        outflow:
          type: integer
          description: "The outflow of this line"
        inflow:
          type: integer
          description: "The inflow of this line"

    BudgetExpenseShare:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: integer
        name:
          type: string

    ExpenseShare:
      type: object
      required:
        - id
        - name
        - defaultName
      properties:
        id:
          type: integer
        name:
          type: string
        defaultName:
          type: string
